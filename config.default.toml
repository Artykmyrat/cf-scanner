# CF-Scanner Pro Configuration File
# Этот файл содержит настройки по умолчанию.
# CLI аргументы имеют приоритет над значениями здесь.

[scan]
# Режим сканирования: cloudflare | raw | xray
mode = "cloudflare"

# Количество TCP воркеров (параллельных соединений)
workers = 400

# Количество воркеров глубокой проверки
deep_concurrency = 25

# Порты для сканирования (по умолчанию все Cloudflare порты)
ports = [443, 2053, 2083, 2087, 2096, 8443, 8880, 2052, 2082, 2086, 80]

# Максимальное количество результатов (0 = без ограничений)
max_results = 50

# Автосохранение каждые N результатов
autosave_every = 5

# ASN по умолчанию (Cloudflare)
default_asn = "AS13335"

[xray]
# Автоматическая загрузка Xray-Core если не найден
auto_download = true

# Максимальное количество параллельных Xray процессов
max_concurrent = 25

# Порт для локального SOCKS прокси (start порт для пула)
socks_port_start = 31000

# Размер пула портов
port_pool_size = 200

[cache]
# Время жизни записи в кэше (дни)
expiry_days = 30

# Периодичность записи кэша на диск (количество меток "bad")
flush_every = 100

[network]
# Таймаут TCP подключения (секунды)
tcp_timeout = 0.8

# Таймаут TLS handshake (секунды)
tls_timeout = 5.0

# Таймаут HTTP запроса для проверки Cloudflare (секунды)
cloudflare_timeout = 5.0

[ui]
# Частота обновления дашборда (кадров в секунду)
refresh_rate = 7

# Показывать анимированный спиннер
show_spinner = true
